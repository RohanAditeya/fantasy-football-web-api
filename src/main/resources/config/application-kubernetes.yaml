spring:
  r2dbc:
    url: r2dbc:postgresql://postgresql.postgres.svc.cluster.local:5432/fantasy-football?currentSchema=public
    username: postgres
    properties:
      sslmode: disable
    pool:
      enabled: true
      max-size: 5
      initial-size: 5
  liquibase:
    url: jdbc:postgresql://postgresql.postgres.svc.cluster.local:5432/fantasy-football?currentSchema=public&sslmode=disable
    user: postgres
    defaultSchema: public
    liquibaseSchema: public
management:
  endpoint:
    health:
      probes:
        enabled: true # Explicitly enable them so that they are enabled if only kube profile is active otherwise will only be enabled when native image is built in kube environment